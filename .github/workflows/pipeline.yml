name: EAF Pipeline
run-name: "${{ github.ref == 'refs/heads/main' && 'deploy' || 'check' }} — ${{ github.event_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  ECR_REGISTRY: "718438899462.dkr.ecr.eu-west-2.amazonaws.com"
  DEV_ACCOUNT_ID: "718438899462"

# ─────────────────────────────────────────────────────────────────────────────
# JOB GRAPH
#
#   checks ─┬─→ plan ──→ deploy      (deploy: main + manual dispatch only)
#           └─→ build-images         (independent of deploy — see RC1)
#
# WHEN EACH RUNS
#
#   any branch, push:   checks ✓   plan ✓   build-images —   deploy —
#   main, push:         checks ✓   plan ✓   build-images —   deploy —
#   main, dispatch:     checks ✓   plan ✓   build-images ✓   deploy ✓
#
# So a merge to main runs static checks and a plan, and changes nothing. Both
# jobs that act on the world require a deliberate dispatch, which is how every
# other workflow in this repository already behaves.
#
# Two deliberate properties, both explained at the jobs themselves:
#
#   build-images does not wait for deploy. Images must exist before anything
#   references them; the reverse ordering is what put every tool image into
#   ImagePullBackOff.
#
#   deploy does not run on a merge. It applies workloads/eaf/dev, which is
#   being torn down and rebuilt as three layers, and each run performs seven
#   unreviewed state mutations before failing. Applying is a deliberate act
#   until that layer is replaced, at which point this reverts to running on
#   merge with per-layer plans.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. checks ──────────────────────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: make fmt-check

      - name: validate
        run: make validate

      - name: yaml
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path('.github/workflows').glob('*.yml'):
              try: yaml.safe_load(f.read_text())
              except Exception as e: errors.append(f'{f}: {e}')
          if errors: sys.exit('\n'.join(errors))
          print('all workflow YAML valid')
          "

      - name: register
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate_register.py accounts/register.yaml

  # ── 2. plan ────────────────────────────────────────────────────────────────
  plan:
    name: plan
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-plan-${{ github.run_id }}

      - name: plan workloads/eaf/dev
        working-directory: workloads/eaf/dev
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          # -refresh=false: plan role is read-only on state — state rm and import
          # cannot write here. Deploy role fixes state permanently. After first
          # successful deploy, remove -refresh=false (state is clean going forward).
          terraform plan -no-color -input=false -lock-timeout=10m -refresh=false | tee plan.txt
          grep -qE '^(Plan: |No changes)' plan.txt || { echo "no plan summary" >&2; exit 1; }

      - name: summary
        if: always()
        working-directory: workloads/eaf/dev
        run: |
          {
            echo "## plan"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. deploy — manual dispatch only, temporarily ──────────────────────────
  #
  # TEMPORARY, and it comes off when workloads/eaf/dev is rebuilt as three
  # layers. Do not restore auto-apply before then.
  #
  # Why: this job applies workloads/eaf/dev, the layer being torn down. Before
  # it reaches terraform apply it performs seven out-of-band mutations — a
  # Secrets Manager force-delete, deletion of the state lock object, and a
  # series of `terraform state rm` and `import` calls — every one of them
  # wrapped in `|| true` so none can fail visibly. It then times out on the
  # aws-ebs-csi-driver addon. Four consecutive runs on main have failed this
  # way, the most recent at 13m40s.
  #
  # Firing that on every merge means an unrelated change — a doc edit, a new
  # module — mutates live AWS state and burns twenty minutes. This condition
  # makes applying a deliberate act instead of a side effect of merging.
  #
  # Note this is a manual TRIGGER, not an approval gate: the dev environment
  # has no protection rules, so nothing pauses waiting for a reviewer.
  #
  # It also brings workloads into line with every other workflow in this
  # repository — apply-foundation, create-accounts, apply-security-baseline and
  # destroy-workloads are all workflow_dispatch only. pipeline.yml was the sole
  # exception, and the sole layer that has never applied successfully.
  deploy:
    name: deploy dev
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No environment: — with environment: dev the OIDC sub becomes
    # environment:dev which the deployer role trust policy does not accept.
    # Without it the sub is ref:refs/heads/main which matches ref:refs/heads/*.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-deploy-${{ github.run_id }}

      - name: force-delete pending secrets
        run: |
          # Secrets in pending-deletion state block re-creation with the same name.
          # Force-delete them so Terraform can recreate cleanly.
          # || true because it is fine if the secret does not exist
          aws secretsmanager delete-secret \
            --secret-id eaf-dev/gateway/agent-client-creds \
            --force-delete-without-recovery \
            --region ${{ vars.AWS_REGION }} || true

      - name: clear stuck state lock
        working-directory: workloads/eaf/dev
        run: |
          BUCKET=$(grep 'bucket' backend.hcl | awk -F'"' '{print $2}')
          KEY=$(grep '^key' backend.hcl | awk -F'"' '{print $2}')
          aws s3 rm "s3://${BUCKET}/${KEY}.tflock" --region eu-west-2 || true

      - name: init
        working-directory: workloads/eaf/dev
        run: terraform init -input=false -no-color -backend-config=backend.hcl

      - name: one-time state fix — remove null-identity deployments
        working-directory: workloads/eaf/dev
        run: |
          # One-time state migration — deployer role has state write access.
          # Remove this block after first successful apply.
          # searxng removed from config — state rm only
          terraform state rm kubernetes_deployment.searxng 2>/dev/null || true
          # firecrawl_* still in config — state rm + import to fix null identity
          for r in \
            "kubernetes_deployment.firecrawl_redis:tools/firecrawl-redis" \
            "kubernetes_deployment.firecrawl_playwright:tools/firecrawl-playwright" \
            "kubernetes_deployment.firecrawl_api:tools/firecrawl-api" \
            "kubernetes_deployment.firecrawl_worker:tools/firecrawl-worker"; do
            resource="${r%%:*}"
            id="${r##*:}"
            terraform state rm "$resource" 2>/dev/null || true
            terraform import -input=false "$resource" "$id" 2>/dev/null || true
          done

      - name: phase 1 — EKS access policy
        working-directory: workloads/eaf/dev
        run: |
          # Grant OrganizationAccountAccessRole EKS cluster-admin first so
          # the Kubernetes/Helm providers can authenticate in phase 2.
          terraform apply -no-color -input=false -lock-timeout=10m \
            -target=aws_eks_access_policy_association.org_role_admin \
            -target=aws_eks_access_policy_association.workload_deployer_admin \
            -auto-approve || true

      - name: phase 2 — full apply
        working-directory: workloads/eaf/dev
        run: |
          set -euo pipefail
          # Fresh plan after phase 1 — phase 1 changes state so saved plans go stale.
          terraform plan  -no-color -input=false -lock-timeout=10m -out=tfplan-apply
          terraform apply -no-color -input=false -lock-timeout=30m tfplan-apply

      - name: outputs
        if: always()
        working-directory: workloads/eaf/dev
        run: |
          {
            echo "## deployed"
            echo '```'
            terraform output -no-color 2>/dev/null || echo "no outputs yet"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. build-images — no longer waits for deploy ───────────────────────────
  #
  # `needs: checks`, not `needs: deploy`. This is RC1 in the design document,
  # and it is the reason every tool image reference in the cluster sat in
  # ImagePullBackOff.
  #
  # The old ordering was checks -> plan -> deploy -> build-images. But deploy
  # creates Kubernetes Deployments whose containers reference
  # tools/firecrawl and tools/firecrawl-playwright, and those repositories were
  # empty. So deploy could not converge because the images did not exist, and
  # the images were never built because build-images was queued behind deploy.
  # A deadlock that no number of retries resolves, because the order is simply
  # wrong: the pipeline was told to install the application before it was told
  # to build it.
  #
  # Building images depends on nothing but the source, so it depends on nothing
  # but checks. Images now exist before anything can reference them.
  #
  # This job touches no Terraform state — it builds a container and pushes to
  # ECR — so decoupling it from deploy carries no state risk.
  # DEFERRED to manual dispatch until Firecrawl is rebuilt (design Step 6).
  #
  # Decoupling this job from deploy let it run for the first time, and it failed
  # honestly: Trivy found 3 HIGH advisories in pnpm 11.4.0 inside the upstream
  # image, and the scan step uses exit-code: 1.
  #
  #   GHSA-72r4-9c5j-mj57  patch-remove deletes files outside patches/
  #   GHSA-fr4h-3cph-29xv  hoisted install imports local node_modules
  #   GHSA-qrv3-253h-g69c  path traversal in configDependencies
  #
  # These were never a regression — they were hidden. build-images had
  # `needs: deploy`, deploy has failed every run for days, so these images had
  # never been built or scanned at all. The .trivyignore lists CVE ids; these are
  # GHSA ids, so nothing suppressed them.
  #
  # Why defer rather than suppress: nothing consumes these images (all three ECR
  # repositories hold 0 images), the layer that creates those repositories is
  # about to be destroyed, and Firecrawl is being rebuilt as five services on a
  # pinned release. Suppressing advisories to green a build for images nothing
  # uses, which breaks again at teardown when the repositories disappear, is
  # motion without progress.
  #
  # TWO REAL FIXES, both due at Step 6 — do not simply suppress:
  #
  #   1. pnpm is declared as a single manifest field upstream, in
  #      apps/api/package.json: "packageManager": "pnpm@11.4.0". Trivy reads the
  #      manifest, not the installed binary. So the fix is a layer that does
  #      `corepack prepare pnpm@11.8.0 --activate` AND corrects the field.
  #      Patching only the field would silence the scanner while leaving the
  #      vulnerable binary in place — do not do that.
  #      Risk assessment meanwhile: all three advisories require running pnpm
  #      operations. It is a build-time package manager in a runtime image, and
  #      nothing in a running Firecrawl container invokes it.
  #
  #   2. images/firecrawl/Dockerfile pins `ghcr.io/firecrawl/firecrawl:latest`.
  #      A floating tag means two builds produce different images and the scan
  #      result is tied to nothing Git records — the same fault as :latest in the
  #      Kubernetes manifests. Pin a release digest; upstream self-hosting docs
  #      recommend a pinned version.
  build-images:
    name: build ${{ matrix.image.name }}
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: tools/firecrawl
            context: images/firecrawl
          - name: tools/firecrawl-playwright
            context: images/firecrawl-playwright

    steps:
      - uses: actions/checkout@v4

      - name: image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: |
          docker build \
            --tag ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:latest \
            ${{ matrix.image.context }}

      - name: scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1
          trivyignores: ${{ matrix.image.context }}/.trivyignore

      - name: sarif report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy.sarif
          scanners: vuln
          exit-code: 0
          trivyignores: ${{ matrix.image.context }}/.trivyignore

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: configure ECR credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.DEV_ACCOUNT_ID }}:role/eaf-agent-ci-role
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-ecr-push-${{ github.run_id }}

      - name: push to ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:latest
