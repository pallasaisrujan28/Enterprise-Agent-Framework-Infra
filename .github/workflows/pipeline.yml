name: EAF Pipeline
run-name: "${{ github.ref == 'refs/heads/main' && 'deploy' || 'check' }} — ${{ github.event_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  ECR_REGISTRY: "718438899462.dkr.ecr.eu-west-2.amazonaws.com"
  DEV_ACCOUNT_ID: "718438899462"

# ─────────────────────────────────────────────────────────────────────────────
# JOB GRAPH — reduced, because the layer this pipeline deployed no longer exists.
#
#   checks ──→ build-images     (build-images: main + manual dispatch only)
#
# WHEN EACH RUNS
#
#   any branch, push:   checks ✓   build-images —
#   main, push:         checks ✓   build-images —
#   main, dispatch:     checks ✓   build-images ✓
#
# So a merge to main runs static checks and changes nothing at all.
#
# The plan and deploy jobs were removed with workloads/eaf/dev, which was
# destroyed (82 resources, run 33394897276) and deleted from this repository.
# They are replaced at design Steps 3 and 4 by one plan and one apply job per
# layer — platform, cluster-addons, apps — each applying a saved plan artefact.
#
# build-images remains dispatch-only until Firecrawl is rebuilt at Step 6. It also
# has nowhere to push right now: the ECR repositories it targeted were created by
# the destroyed layer and will be recreated by L1.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. checks ──────────────────────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: make fmt-check

      - name: validate
        run: make validate

      - name: yaml
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path('.github/workflows').glob('*.yml'):
              try: yaml.safe_load(f.read_text())
              except Exception as e: errors.append(f'{f}: {e}')
          if errors: sys.exit('\n'.join(errors))
          print('all workflow YAML valid')
          "

      - name: register
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate_register.py accounts/register.yaml

  # ── plan and deploy: REMOVED with the layer they operated on ───────────────
  #
  # Both jobs targeted workloads/eaf/dev, which has been destroyed (82 resources,
  # run 33394897276) and deleted from this repository. A job whose
  # working-directory does not exist is dead code, so they are gone rather than
  # left to fail.
  #
  # What replaces them, at design Step 3 and 4: one plan job and one apply job per
  # layer — platform, cluster-addons, apps — each planning to a saved artefact and
  # applying that artefact. Not a single monolithic deploy.
  #
  # Two properties the removed jobs lacked, and the replacements must have:
  #
  #   Refresh enabled. The old plan ran -refresh=false and authenticated as a
  #   management-account role against resources in EAF-DEV, so it never read them
  #   and passed by not looking (RC7). Each new layer gets a plan role with
  #   in-account read access.
  #
  #   No out-of-band mutation. The old deploy performed seven state and AWS
  #   mutations before applying, every one wrapped in `|| true`. The replacements
  #   contain no `state rm`, no `import`, no `aws` CLI writes, and no suppressed
  #   exit codes.

  # ── 4. build-images — no longer waits for deploy ───────────────────────────
  #
  # `needs: checks`, not `needs: deploy`. This is RC1 in the design document,
  # and it is the reason every tool image reference in the cluster sat in
  # ImagePullBackOff.
  #
  # The old ordering was checks -> plan -> deploy -> build-images. But deploy
  # creates Kubernetes Deployments whose containers reference
  # tools/firecrawl and tools/firecrawl-playwright, and those repositories were
  # empty. So deploy could not converge because the images did not exist, and
  # the images were never built because build-images was queued behind deploy.
  # A deadlock that no number of retries resolves, because the order is simply
  # wrong: the pipeline was told to install the application before it was told
  # to build it.
  #
  # Building images depends on nothing but the source, so it depends on nothing
  # but checks. Images now exist before anything can reference them.
  #
  # This job touches no Terraform state — it builds a container and pushes to
  # ECR — so decoupling it from deploy carries no state risk.
  # DEFERRED to manual dispatch until Firecrawl is rebuilt (design Step 6).
  #
  # Decoupling this job from deploy let it run for the first time, and it failed
  # honestly: Trivy found 3 HIGH advisories in pnpm 11.4.0 inside the upstream
  # image, and the scan step uses exit-code: 1.
  #
  #   GHSA-72r4-9c5j-mj57  patch-remove deletes files outside patches/
  #   GHSA-fr4h-3cph-29xv  hoisted install imports local node_modules
  #   GHSA-qrv3-253h-g69c  path traversal in configDependencies
  #
  # These were never a regression — they were hidden. build-images had
  # `needs: deploy`, deploy has failed every run for days, so these images had
  # never been built or scanned at all. The .trivyignore lists CVE ids; these are
  # GHSA ids, so nothing suppressed them.
  #
  # Why defer rather than suppress: nothing consumes these images (all three ECR
  # repositories hold 0 images), the layer that creates those repositories is
  # about to be destroyed, and Firecrawl is being rebuilt as five services on a
  # pinned release. Suppressing advisories to green a build for images nothing
  # uses, which breaks again at teardown when the repositories disappear, is
  # motion without progress.
  #
  # TWO REAL FIXES, both due at Step 6 — do not simply suppress:
  #
  #   1. pnpm is declared as a single manifest field upstream, in
  #      apps/api/package.json: "packageManager": "pnpm@11.4.0". Trivy reads the
  #      manifest, not the installed binary. So the fix is a layer that does
  #      `corepack prepare pnpm@11.8.0 --activate` AND corrects the field.
  #      Patching only the field would silence the scanner while leaving the
  #      vulnerable binary in place — do not do that.
  #      Risk assessment meanwhile: all three advisories require running pnpm
  #      operations. It is a build-time package manager in a runtime image, and
  #      nothing in a running Firecrawl container invokes it.
  #
  #   2. images/firecrawl/Dockerfile pins `ghcr.io/firecrawl/firecrawl:latest`.
  #      A floating tag means two builds produce different images and the scan
  #      result is tied to nothing Git records — the same fault as :latest in the
  #      Kubernetes manifests. Pin a release digest; upstream self-hosting docs
  #      recommend a pinned version.
  build-images:
    name: build ${{ matrix.image.name }}
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: tools/firecrawl
            context: images/firecrawl
          - name: tools/firecrawl-playwright
            context: images/firecrawl-playwright

    steps:
      - uses: actions/checkout@v4

      - name: image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: |
          docker build \
            --tag ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:latest \
            ${{ matrix.image.context }}

      - name: scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1
          trivyignores: ${{ matrix.image.context }}/.trivyignore

      - name: sarif report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy.sarif
          scanners: vuln
          exit-code: 0
          trivyignores: ${{ matrix.image.context }}/.trivyignore

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: configure ECR credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.DEV_ACCOUNT_ID }}:role/eaf-agent-ci-role
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-ecr-push-${{ github.run_id }}

      - name: push to ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}:latest
