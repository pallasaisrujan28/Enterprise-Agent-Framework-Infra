# APPLY — creates and updates AWS resources.
#
# Always two phases:
#   plan    read-only role, no gate — prints exactly what will change
#   apply   admin role, behind an approval gate — applies THAT saved plan
#
# The reviewer approves the plan they can read, not one generated afterwards.
#
# Targets:
#   accounts       OUs, guardrail SCPs, and AWS accounts  (the common case)
#   infrastructure IAM roles and pipeline foundation       (rare — only when
#                  bootstrap/seed Terraform changes)
#
# The push-to-main auto-trigger is commented out until the per-account
# baseline layer is built. Re-enable by uncommenting the push block below.

name: apply

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "bootstrap/org-structure/**"
  #     - "accounts/**"
  #     - "scripts/**"

  workflow_dispatch:
    inputs:
      target:
        description: "What to apply"
        required: true
        type: choice
        default: accounts
        options:
          - accounts        # applies bootstrap/org-structure: OUs, SCPs, accounts
          - infrastructure  # applies bootstrap/seed: IAM roles, OIDC, state bucket
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  # Resolve the target once so downstream jobs don't need to handle empty inputs.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      layer: ${{ steps.pick.outputs.layer }}
    steps:
      - name: resolve target to layer
        id: pick
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.confirm }}" != "apply" ]]; then
              echo "type the word apply in the confirm field to proceed" >&2
              exit 1
            fi
            case "${{ inputs.target }}" in
              accounts)       layer="org-structure" ;;
              infrastructure) layer="seed"          ;;
              *)
                echo "unknown target: ${{ inputs.target }}" >&2; exit 1 ;;
            esac
          else
            # Push trigger: always apply the accounts layer.
            layer="org-structure"
          fi
          echo "layer=$layer" >> "$GITHUB_OUTPUT"
          echo "applying: $layer"

  plan:
    name: plan
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-preapply-plan-${{ github.run_id }}

      - name: verify account
        run: |
          set -euo pipefail
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "refusing: credentials resolve to $actual" >&2; exit 1
          fi

      - name: plan
        id: plan
        working-directory: bootstrap/${{ needs.resolve.outputs.layer }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl

          set +e
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out=tfplan \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found — do not trust this run" >&2; exit 1
          fi

          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "plan failed with exit code $code" >&2; exit "$code" ;;
          esac

      - name: validate SCP
        if: needs.resolve.outputs.layer == 'org-structure'
        run: |
          terraform -chdir=bootstrap/org-structure show -json \
            tfplan > bootstrap/org-structure/plan.json
          bash scripts/check-policies.sh bootstrap/org-structure/plan.json policy-out

      - name: summary
        if: always()
        working-directory: bootstrap/${{ needs.resolve.outputs.layer }}
        run: |
          {
            echo "## ${{ inputs.target || 'accounts' }} — awaiting approval"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
            if [[ "${{ needs.resolve.outputs.layer }}" == "org-structure" ]]; then
              echo "**Read the full plan in the job log before approving.**"
              echo "Creating an AWS account is effectively permanent: closure takes"
              echo "90 days and a closed account still counts against the org quota."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.resolve.outputs.layer }}-${{ github.run_id }}
          path: |
            bootstrap/${{ needs.resolve.outputs.layer }}/tfplan
            bootstrap/${{ needs.resolve.outputs.layer }}/plan.txt
          retention-days: 5

  apply:
    name: apply
    needs: [resolve, plan]
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: management
    concurrency:
      group: apply-${{ needs.resolve.outputs.layer }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.resolve.outputs.layer }}-${{ github.run_id }}
          path: bootstrap/${{ needs.resolve.outputs.layer }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-apply-${{ github.run_id }}

      - name: verify account
        run: |
          set -euo pipefail
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "refusing: credentials resolve to $actual" >&2; exit 1
          fi

      - name: apply
        working-directory: bootstrap/${{ needs.resolve.outputs.layer }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=5m tfplan

      - name: outputs
        working-directory: bootstrap/${{ needs.resolve.outputs.layer }}
        run: |
          {
            echo "## ${{ inputs.target || 'accounts' }} applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no_changes:
    name: nothing to apply
    needs: [resolve, plan]
    if: needs.plan.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### ${{ inputs.target || 'accounts' }}: no changes" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan reported no differences." >> "$GITHUB_STEP_SUMMARY"