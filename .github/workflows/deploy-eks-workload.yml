run-name: Apply — EKS workload
# Applies workloads/eaf/dev or workloads/eaf/prod into EAF-DEV / EAF-PROD.
#
# Triggers:
#   push to main touching workloads/eaf/dev/**  → auto-applies dev (no gate)
#   workflow_dispatch target=dev                 → manual dev apply
#   workflow_dispatch target=prod                → manual prod apply (approval gate)
#
# Why auto-apply dev:
#   Dev is disposable. SCP guardrails + immutable OIDC trust are the blast-radius
#   controls. A broken dev apply can be reverted or reapplied immediately.
#   Prod always requires a human in the loop.

on:
  push:
    branches: [main]
    paths:
      - "workloads/eaf/dev/**"

  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  # Resolve target and confirm from either push context or manual inputs
  vars:
    name: resolve vars
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      is_dev: ${{ steps.set.outputs.is_dev }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Auto-triggered by push to main — always dev, no confirmation needed
            echo "target=dev" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch — validate confirmation
            if [[ "${{ inputs.confirm }}" != "apply" ]]; then
              echo "type the word apply in the confirm field to proceed" >&2; exit 1
            fi
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "is_dev=${{ inputs.target == 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan
    needs: vars
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-plan-${{ github.run_id }}

      - name: plan
        id: plan
        working-directory: workloads/eaf/${{ needs.vars.outputs.target }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl

          set +e
          terraform plan -no-color -input=false -lock-timeout=10m \
            -out=tfplan \
            -detailed-exitcode \
            | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found — do not trust this run" >&2; exit 1
          fi

          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "plan failed with exit code $code" >&2; exit "$code" ;;
          esac

      - name: summary
        if: always()
        working-directory: workloads/eaf/${{ needs.vars.outputs.target }}
        run: |
          {
            echo "## ${{ needs.vars.outputs.target }} workload plan"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-workload-${{ needs.vars.outputs.target }}-${{ github.run_id }}
          path: |
            workloads/eaf/${{ needs.vars.outputs.target }}/tfplan
            workloads/eaf/${{ needs.vars.outputs.target }}/plan.txt
          retention-days: 5

  scan-images:
    name: scan open-source images
    needs: [vars, plan]
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - searxng/searxng:latest
          - ghcr.io/mendableai/firecrawl:latest
          - ghcr.io/mendableai/firecrawl-playwright-service:latest
          - qdrant/qdrant:latest
    steps:
      - uses: actions/checkout@v4

      - name: scan ${{ matrix.image }} with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1

      - name: generate SARIF
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-result.sarif
          scanners: vuln
          exit-code: 0

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-result.sarif

  apply-dev:
    name: apply (dev)
    needs: [vars, plan, scan-images]
    if: needs.plan.outputs.has_changes == 'true' && needs.vars.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: apply-workload-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-dev-${{ github.run_id }}
          path: workloads/eaf/dev
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-dev-${{ github.run_id }}
      - name: apply
        working-directory: workloads/eaf/dev
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: outputs
        working-directory: workloads/eaf/dev
        run: |
          {
            echo "## dev workload applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: apply (prod — approval required)
    needs: [vars, plan, scan-images]
    if: needs.plan.outputs.has_changes == 'true' && needs.vars.outputs.is_dev == 'false'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: apply-workload-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-prod-${{ github.run_id }}
          path: workloads/prod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-prod-${{ github.run_id }}
      - name: apply
        working-directory: workloads/prod
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: outputs
        working-directory: workloads/prod
        run: |
          {
            echo "## prod workload applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  nothing-to-apply:
    name: nothing to apply
    needs: [vars, plan]
    if: needs.plan.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### ${{ needs.vars.outputs.target }}: no changes" >> "$GITHUB_STEP_SUMMARY"
