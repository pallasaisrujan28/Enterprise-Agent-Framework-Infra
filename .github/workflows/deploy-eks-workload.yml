name: Deploy — EKS workload
# APPLY WORKLOAD — deploys EKS, Aurora, S3, and IAM into EAF-DEV or EAF-PROD.
#
# Run AFTER the account baseline is applied (GuardDuty, Security Hub, CI role).
# This layer creates the actual compute infrastructure for the agent:
#   - VPC with public/private subnets and NAT gateway
#   - EKS cluster with managed node group
#   - Aurora PostgreSQL Serverless v2 (LangGraph checkpointer)
#   - S3 workspace bucket
#   - IRSA role for the agent pod (Bedrock, AgentCore, S3, Secrets Manager)
#
# Approval gates:
#   dev   no approval — disposable, SCP guardrails the risk
#   prod  required approval


on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: check confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "apply" ]]; then
            echo "type the word apply in the confirm field to proceed" >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-plan-${{ github.run_id }}

      - name: plan
        id: plan
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl

          set +e
          terraform plan -no-color -input=false -lock-timeout=10m \
            -out=tfplan \
            -detailed-exitcode \
            | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found — do not trust this run" >&2; exit 1
          fi

          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "plan failed with exit code $code" >&2; exit "$code" ;;
          esac

      - name: summary
        if: always()
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          {
            echo "## ${{ inputs.target }} workload plan"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
            echo "EKS clusters take 15–20 minutes to create. Aurora takes 5–10 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-workload-${{ inputs.target }}-${{ github.run_id }}
          path: |
            workloads/eaf/${{ inputs.target }}/tfplan
            workloads/eaf/${{ inputs.target }}/plan.txt
          retention-days: 5

  scan-images:
    name: scan open-source images
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - searxng/searxng:latest
          - unclecode/crawl4ai:latest
          - qdrant/qdrant:latest
    steps:
      - uses: actions/checkout@v4

      - name: scan ${{ matrix.image }} with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1   # block deploy if fixable CRITICAL/HIGH found in open-source image

      - name: generate SARIF for ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.image == 'searxng/searxng:latest' && 'searxng' || matrix.image == 'unclecode/crawl4ai:latest' && 'crawl4ai' || 'qdrant' }}.sarif
          scanners: vuln
          exit-code: 0

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image == 'searxng/searxng:latest' && 'searxng' || matrix.image == 'unclecode/crawl4ai:latest' && 'crawl4ai' || 'qdrant' }}.sarif

  apply-dev:
    name: apply (dev — no gate)
    needs: [plan, scan-images]
    if: needs.plan.outputs.has_changes == 'true' && inputs.target == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: apply-workload-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-dev-${{ github.run_id }}
          path: workloads/eaf/dev
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-dev-${{ github.run_id }}
      - name: apply
        working-directory: workloads/eaf/dev
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: outputs
        working-directory: workloads/eaf/dev
        run: |
          {
            echo "## dev workload applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: apply (prod — approval required)
    needs: [plan, scan-images]
    if: needs.plan.outputs.has_changes == 'true' && inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: apply-workload-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-prod-${{ github.run_id }}
          path: workloads/prod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-prod-${{ github.run_id }}
      - name: apply
        working-directory: workloads/prod
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: outputs
        working-directory: workloads/prod
        run: |
          {
            echo "## prod workload applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no_changes:
    name: nothing to apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### ${{ inputs.target }} workload has no changes" >> "$GITHUB_STEP_SUMMARY"
