# DEPRECATED — replaced by store-email.yml
#
# The request-account workflow used to automate the full account request:
# storing the email in SSM, editing accounts/register.yaml, and opening a PR.
#
# That approach removed the developer from the audit trail. The new flow is:
#
#   1. Run store-email workflow once (stores email in SSM).
#   2. Developer adds entry to accounts/register.yaml on a feature branch.
#   3. Developer opens PR — their git author line is the request record.
#   4. Reviewer merges. apply creates the account.
#
# This file is kept to preserve git history. It has no trigger and will never run.
# Use store-email.yml for new account requests.
