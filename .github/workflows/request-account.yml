# REQUEST AN ACCOUNT. This is the front door of the vending machine.
#
# Creates NOTHING in AWS except one SSM parameter holding the requested email. It adds an
# entry to accounts/register.yaml and opens a pull request. Merging that pull request is
# what causes the account to be provisioned.
#
# Three steps, three different trust levels, on purpose:
#
#   request  any branch, narrow role, writes one SSM parameter        <- this workflow
#   review   a human reads a one-line diff plus the plan
#   apply    approval-gated admin role, creates the account
#
# WHY THE EMAIL GOES TO SSM AND NOT INTO THE PULL REQUEST:
#
# An account's email becomes its root user and its only account-recovery address. It is
# personal data and it is permanent — AWS has no API to change it. So it never enters git
# history, and never appears in a plan artifact.
#
# LATER: Argo CD, a form, or a service desk can replace the manual dispatch. Anything
# that can call the GitHub API can trigger this, and the rest of the flow is unchanged.

name: request-account

on:
  workflow_dispatch:
    inputs:
      account_name:
        description: "Account name, e.g. EAF-DEV. Letters, digits and hyphens. CANNOT be changed later."
        required: true
        type: string
      account_email:
        description: "Root email. Must be globally unique across all of AWS and CANNOT be changed after creation."
        required: true
        type: string
      ou:
        description: "Which OU. Created if it does not exist. Decides which SCPs apply."
        required: true
        default: Workloads
        type: string
      environment:
        description: "Environment label"
        required: true
        type: choice
        options: [dev, test, staging, prod]
      cost_centre:
        description: "Cost centre, for billing allocation"
        required: true
        default: TBC
        type: string
      project:
        description: "Project this account belongs to"
        required: true
        type: string
      owner:
        description: "Who owns it. A person or a team."
        required: true
        type: string
      ticket:
        description: "Ticket or change reference (optional)"
        required: false
        type: string
      description:
        description: "One line on what it is for (optional)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  # Serialised. Two requests at once would branch from the same register and the second
  # pull request would silently drop the first entry on merge.
  group: request-account
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest

    env:
      NAME: ${{ inputs.account_name }}
      EMAIL: ${{ inputs.account_email }}
      PREFIX: ${{ vars.AWS_EMAIL_PARAMETER_PREFIX }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: validate the inputs
        run: |
          set -euo pipefail
          # Checked here as well as in Terraform, because the useful moment to reject a
          # typo is before it is stored, not after an account exists with it.
          if ! printf '%s' "$EMAIL" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "not a valid email address" >&2
            exit 1
          fi
          if ! printf '%s' "$NAME" | grep -qE '^[A-Za-z0-9][A-Za-z0-9-]{0,49}$'; then
            echo "account name must be letters, digits and hyphens, max 50 chars" >&2
            exit 1
          fi
          if [[ -z "$PREFIX" ]]; then
            echo "AWS_EMAIL_PARAMETER_PREFIX repository variable is not set" >&2
            exit 1
          fi
          echo "inputs ok"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ACCOUNT_REQUEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-request-${{ github.run_id }}

      - name: store the email in SSM
        run: |
          set -euo pipefail
          param="${PREFIX}/${NAME}/email"

          # REFUSE TO OVERWRITE. An existing parameter means the account either exists or
          # was already requested, and AWS cannot change an account's email afterwards.
          # Overwriting would leave the parameter and the real account disagreeing, which
          # is worse than failing here.
          if aws ssm get-parameter --name "$param" >/dev/null 2>&1; then
            echo "$param already exists. Refusing to overwrite." >&2
            echo "An account email cannot be changed after creation." >&2
            exit 1
          fi

          aws ssm put-parameter \
            --name "$param" \
            --type String \
            --value "$EMAIL" \
            --description "Root email for AWS account ${NAME}. Requested by ${{ github.actor }}, run ${{ github.run_id }}." \
            --tags "Key=ManagedBy,Value=github-actions" "Key=Account,Value=${NAME}" \
            > /dev/null

          # Print the parameter NAME, never the value.
          echo "stored $param"

      - name: add it to the register
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 scripts/register_add.py \
            --register accounts/register.yaml \
            --name "$NAME" \
            --ou "${{ inputs.ou }}" \
            --cost-centre "${{ inputs.cost_centre }}" \
            --environment "${{ inputs.environment }}" \
            --project "${{ inputs.project }}" \
            --owner "${{ inputs.owner }}" \
            --ticket "${{ inputs.ticket }}" \
            --description "${{ inputs.description }}"

      - name: open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OU: ${{ inputs.ou }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ inputs.project }}
          COST_CENTRE: ${{ inputs.cost_centre }}
          OWNER: ${{ inputs.owner }}
          TICKET: ${{ inputs.ticket }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          lower_name=$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]')
          branch="request/account-${lower_name}-${RUN_ID}"

          # Written to files rather than inlined. Multi-line text inside a YAML block
          # scalar has to stay indented, and an unindented continuation silently breaks
          # the whole workflow file.
          cat > /tmp/commit-msg.txt <<EOF
          feat(accounts): request ${NAME}

          Requested by ${ACTOR} through the request-account workflow, run ${RUN_ID}.

            ou           ${OU}
            environment  ${ENVIRONMENT}
            project      ${PROJECT}
            cost centre  ${COST_CENTRE}
            owner        ${OWNER}
            ticket       ${TICKET}

          The root email is stored in SSM at ${PREFIX}/${NAME}/email and deliberately does
          not appear here. It becomes the account's root user and only recovery address,
          AWS cannot change it afterwards, and git history is permanent.
          EOF
          # Strip the indentation the heredoc needed to keep the YAML valid.
          sed -i 's/^          //' /tmp/commit-msg.txt

          cat > /tmp/pr-body.md <<EOF
          Requested by @${ACTOR} through the \`request-account\` workflow.

          | | |
          |---|---|
          | account | \`${NAME}\` |
          | ou | \`${OU}\` |
          | environment | ${ENVIRONMENT} |
          | project | ${PROJECT} |
          | cost centre | ${COST_CENTRE} |
          | owner | ${OWNER} |
          | ticket | ${TICKET} |

          The root email is stored in SSM at \`${PREFIX}/${NAME}/email\`. It is not in this
          diff on purpose: it becomes the account's root user and only recovery address,
          AWS has no API to change it, and git history is permanent.

          **Before merging**, read the plan on this pull request. It should show **one**
          account to add and nothing else. Merging triggers the gated apply.

          Creating an account is effectively permanent. Closure takes 90 days and a closed
          account still counts against the organization quota.
          EOF
          sed -i 's/^          //' /tmp/pr-body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add accounts/register.yaml
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Request AWS account ${NAME}" \
            --body-file /tmp/pr-body.md

      - name: summary
        if: always()
        run: |
          {
            echo "### Requested \`${NAME}\`"
            echo ""
            echo "Email stored in SSM. Register updated. Pull request opened."
            echo "Merging the pull request triggers the gated apply."
          } >> "$GITHUB_STEP_SUMMARY"
