# Static checks. NO AWS CREDENTIALS.
#
# Deliberately credential-free so it runs on every push with nothing to leak and
# nothing to configure. `terraform init -backend=false` skips the S3 backend, which
# is what makes validate possible without touching AWS.
#
# What this CANNOT catch: anything that depends on real values. A nonexistent IAM
# action, a wrong Control Tower baseline version, a policy that is too long. Those
# need the plan workflow.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref. A stale check result is worse than
  # no result, because it reads as current.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          # No wrapper. It rewrites stdout, which breaks anything that greps the
          # output — and a grep that silently matches nothing reports success.
          terraform_wrapper: false

      # Formatting first: it is the fastest check and the most common failure.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          set -euo pipefail
          # Every directory holding .tf files is a separate program with its own
          # init. There is no repository-wide validate.
          for dir in $(find . -name '*.tf' -not -path './.git/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init
          # --recursive walks every directory. Without it tflint checks only the
          # root and reports clean while never having looked at bootstrap/.
          tflint --recursive --format compact
