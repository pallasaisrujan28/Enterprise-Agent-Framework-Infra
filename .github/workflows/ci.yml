# CI — runs on every push to every branch.
#
# Two jobs:
#   validate  static checks, no AWS credentials, always runs
#   plan      terraform plan against real AWS, only when terraform files changed
#
# The plan result is the review artefact: when you open a PR the plan is
# already visible, so the reviewer reads "1 to add" before they click merge.

name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  # ── 1. Detect whether terraform-relevant files changed ────────────────────
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.check.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          set -euo pipefail
          # Always plan on workflow_dispatch (pull_request events give a different OIDC sub that the plan role does not accept).
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # On a brand-new branch the before SHA is all zeros.
          before="${{ github.event.before }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
               | grep -qE '^(bootstrap|accounts|scripts)/'; then
            echo "terraform=true"  >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Static checks — no credentials ─────────────────────────────────────
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: validate
        run: |
          set -euo pipefail
          for dir in $(find . -name '*.tf' -not -path './.git/*' \
                        -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive --format compact

      - name: validate register
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 scripts/validate_register.py accounts/register.yaml

  # ── 3. Terraform plan — needs AWS credentials ──────────────────────────────
  plan:
    name: plan
    needs: [changes, validate]
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-ci-plan-${{ github.run_id }}

      - name: verify account
        run: |
          set -euo pipefail
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "refusing: credentials resolve to $actual, expected ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" >&2
            exit 1
          fi

      - name: plan seed
        working-directory: bootstrap/seed
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt
          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found — do not trust this run" >&2; exit 1
          fi

      - name: plan org-structure
        working-directory: bootstrap/org-structure
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out=tfplan \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt
          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found — do not trust this run" >&2; exit 1
          fi
          terraform show -json tfplan > plan.json

      - name: validate SCP
        run: bash scripts/check-policies.sh bootstrap/org-structure/plan.json policy-out

      - name: summary
        if: always()
        run: |
          {
            echo "## Plan"
            echo "### seed"
            echo '```'
            grep -E '^(Plan: |No changes)' bootstrap/seed/plan.txt \
              || echo "plan did not complete"
            echo '```'
            echo "### accounts"
            echo '```'
            grep -E '^(Plan: |No changes)' bootstrap/org-structure/plan.txt \
              || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            bootstrap/org-structure/tfplan
            bootstrap/org-structure/plan.txt
          retention-days: 5