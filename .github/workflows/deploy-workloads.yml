name: Deploy workloads
run-name: "Deploy ${{ github.event_name == 'push' && 'dev (auto)' || inputs.target }} by @${{ github.actor }}"

on:
  push:
    branches: [main]
  # No path filter — triggers on every push to main.
  # The plan step detects if Terraform files changed. If nothing changed,
  # has_changes=false and apply is skipped automatically. Safe to run always.
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  vars:
    name: resolve target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      is_dev: ${{ steps.set.outputs.is_dev }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ inputs.confirm }}" != "apply" ]]; then
              echo "type 'apply' in the confirm field to proceed" >&2
              exit 1
            fi
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "is_dev=${{ inputs.target == 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan
    needs: vars
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-plan-${{ github.run_id }}

      - name: plan
        id: plan
        working-directory: workloads/eaf/${{ needs.vars.outputs.target }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          set +e
          terraform plan -no-color -input=false -lock-timeout=10m \
            -out=tfplan -detailed-exitcode | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          grep -qE '^(Plan: |No changes)' plan.txt || { echo "no plan summary" >&2; exit 1; }
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: summary
        if: always()
        working-directory: workloads/eaf/${{ needs.vars.outputs.target }}
        run: |
          {
            echo "## ${{ needs.vars.outputs.target }} plan"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-workload-${{ needs.vars.outputs.target }}-${{ github.run_id }}
          path: |
            workloads/eaf/${{ needs.vars.outputs.target }}/tfplan
            workloads/eaf/${{ needs.vars.outputs.target }}/plan.txt
          retention-days: 5

  apply-dev:
    name: apply dev
    needs: [vars, plan]
    if: needs.plan.outputs.has_changes == 'true' && needs.vars.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: apply-workload-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-dev-${{ github.run_id }}
          path: workloads/eaf/dev
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-dev-${{ github.run_id }}
      - name: clear stuck state lock
        working-directory: workloads/eaf/dev
        run: |
          BUCKET=$(grep 'bucket' backend.hcl | awk -F'"' '{print $2}')
          KEY=$(grep '^key' backend.hcl | awk -F'"' '{print $2}')
          aws s3 rm "s3://${BUCKET}/${KEY}.tflock" --region eu-west-2 || true

      - name: apply
        working-directory: workloads/eaf/dev
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: summary
        working-directory: workloads/eaf/dev
        run: |
          {
            echo "## dev applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: apply prod
    needs: [vars, plan]
    if: needs.plan.outputs.has_changes == 'true' && needs.vars.outputs.is_dev == 'false'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: apply-workload-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-workload-prod-${{ github.run_id }}
          path: workloads/prod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-apply-prod-${{ github.run_id }}
      - name: apply
        working-directory: workloads/prod
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=30m tfplan
      - name: summary
        working-directory: workloads/prod
        run: |
          {
            echo "## prod applied"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no-changes:
    name: no changes
    needs: [vars, plan]
    if: needs.plan.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
            echo "### ${{ needs.vars.outputs.target }}: no changes" >> "$GITHUB_STEP_SUMMARY"
