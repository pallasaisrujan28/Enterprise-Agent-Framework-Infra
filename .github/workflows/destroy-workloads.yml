# TWO MODES, and the safe one is the default.
#
#   plan_only = true  (default)  read-only. Lists what is tracked in state and
#                                what a destroy would remove, then STOPS. Takes no
#                                state lock, mutates nothing, deletes nothing.
#
#   plan_only = false            the real teardown. Clears a stranded lock, drops
#                                kubernetes_* and helm_release.* from state, plans
#                                the destroy to a saved file, and applies THAT
#                                file.
#
# Why the default is the dry run: an accidental dispatch should show you something,
# not delete a cluster. The typed `confirm` field is a second gate, but a default
# that destroys makes the confirmation the only thing standing between a misclick
# and 71 destroyed resources.
#
# Why two dispatches rather than one job with an approval pause: the `dev`
# environment has no protection rules, so `environment: dev` does not pause
# anything here — it exists to shape the OIDC subject claim, which is what makes
# eaf-baseline-dev-role assumable. A pause would need required reviewers on dev.
# Two dispatches achieve the same outcome without changing the environment's
# protection, and give the reviewer the plan output in between.
name: Destroy workloads
run-name: "${{ inputs.plan_only && 'DRY RUN' || 'DESTROY' }} ${{ inputs.layer }} ${{ inputs.target }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
      layer:
        description: "Which layer to destroy. Destroy in REVERSE order — cluster-addons, then platform. `registry` is deliberately not offered."
        required: true
        type: choice
        options:
          - cluster-addons
          - platform
      plan_only:
        description: "Dry run — show what would be destroyed and stop. Leave checked unless you intend to destroy."
        required: false
        type: boolean
        default: true
      confirm:
        description: 'Type "destroy" to confirm permanent deletion (ignored when plan_only is checked)'
        required: true
        type: string

# `registry` IS DELIBERATELY NOT A CHOICE ABOVE.
#
# The operating rhythm is destroy-and-rebuild, and container images are the one thing that
# should survive it: the agent image is built by a workflow in the APPLICATION repository,
# so losing it means triggering a second repository's pipeline and waiting, while keeping it
# costs about $0.10 per GB-month.
#
# Leaving it out of this dropdown is the whole enforcement. Terraform cannot express "this
# layer has a longer lifetime than that one", so the only place the distinction can live is
# in what this workflow offers. Destroying the registry stays possible and requires someone
# to mean it.

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: destroy ${{ inputs.layer }} (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # The layers have returned, so the guard that used to stop this workflow is gone.
      # What replaces it is narrower: check the specific layer exists, because a typo in
      # a dispatch input should say so rather than fail later inside terraform.
      #
      # DESTROY IN REVERSE DEPENDENCY ORDER. platform holds the cluster, so destroying it
      # while cluster-addons or apps still have state leaves those layers pointing at a
      # cluster that no longer exists — and their own destroy then cannot run, because
      # the Kubernetes provider cannot reach an endpoint that is gone.
      - name: check target exists
        run: |
          DIR="workloads/${{ inputs.target }}/${{ inputs.layer }}"
          if [[ ! -d "$DIR" ]]; then
            {
              echo "## Nothing to destroy"
              echo
              echo "\`$DIR\` does not exist in this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$DIR does not exist — nothing to destroy" >&2
            exit 1
          fi

      - name: check confirmation
        if: ${{ !inputs.plan_only }}
        run: |
          if [[ "${{ inputs.confirm }}" != "destroy" ]]; then
            echo "type 'destroy' in the confirm field to proceed" >&2
            exit 1
          fi

      - name: announce mode
        run: |
          if [[ "${{ inputs.plan_only }}" == "true" ]]; then
            echo "::notice::DRY RUN — nothing will be destroyed or modified."
          else
            echo "::warning::DESTROY — this run will permanently delete ${{ inputs.target }} workloads."
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # eaf-baseline-dev-role explicitly, not a `||` fallback.
      #
      # The previous expression was:
      #   ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN || vars.AWS_BASELINE_DEV_ROLE_ARN }}
      #
      # That is a latent trap. It worked on 29 August only because
      # AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN did not exist yet, so it fell through to
      # the baseline role and destroyed 71 resources cleanly (run 33244371784).
      # The variable was created eight hours later, at which point the expression
      # silently began selecting the deployer role instead — and that role cannot
      # be assumed from this workflow at all, because this job declares
      # `environment: dev`, making the OIDC subject `...:environment:dev`, while
      # the deployer role's trust accepts only `...:ref:refs/heads/*`.
      #
      # So adding a repository variable broke a workflow that did not mention it.
      # A `||` between two roles with different trust conditions is not a fallback,
      # it is a hidden switch. Named explicitly now.
      #
      # eaf-baseline-dev-role is the right principal: it lives in the management
      # account so it survives destroying this layer, its trust requires
      # `environment:dev` which this job provides, it can read and write
      # workloads/dev/* state, and it holds sts:AssumeRole on
      # OrganizationAccountAccessRole — which provider.tf now assumes into.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-destroy-${{ github.run_id }}

      # Deleting a lock object is a mutation, so it does not happen in a dry run.
      # If a lock is genuinely stranded, the dry run fails with a lock error — which
      # is information you want, not something to paper over silently.
      - name: clear stuck state lock
        if: ${{ !inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          # S3 native locking (use_lockfile=true) leaves a .tflock object when a
          # runner crashes. Delete it so the next init/destroy can acquire the lock.
          BUCKET=$(grep 'bucket' backend.hcl | awk -F'"' '{print $2}')
          KEY=$(grep '^key' backend.hcl | awk -F'"' '{print $2}')
          aws s3 rm "s3://${BUCKET}/${KEY}.tflock" --region eu-west-2 || true

      - name: init
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: terraform init -input=false -no-color -backend-config=backend.hcl

      # ── DRY RUN path ─────────────────────────────────────────────────────────
      #
      # -lock=false because a preview has no business holding the state lock, and
      # -refresh=false because refreshing would drive the kubernetes and helm
      # providers, which are configured from a cluster this plan does not touch and
      # which carry the null identities the real run removes. Neither flag is
      # acceptable for an apply; both are correct for a read-only preview, and the
      # summary says so plainly rather than implying more precision than it has.
      - name: dry run — what is tracked and what would be destroyed
        if: ${{ inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          set -euo pipefail
          terraform state list > state-list.txt
          echo "resources in state: $(wc -l < state-list.txt)"
          terraform plan -destroy -no-color -input=false -lock=false -refresh=false \
            | tee destroy-preview.txt
          grep -qE '^(Plan: |No changes)' destroy-preview.txt || {
            echo "no plan summary produced" >&2; exit 1; }

      - name: dry run summary
        if: ${{ inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          {
            echo "# DRY RUN — nothing was destroyed"
            echo
            echo "Target: \`${{ inputs.target }}\`"
            echo
            echo '```'
            grep -E '^(Plan: |No changes)' destroy-preview.txt
            echo '```'
            echo
            echo "Computed with \`-refresh=false -lock=false\`, so this reflects what"
            echo "**state** describes, not a re-read of AWS. Counts may differ slightly"
            echo "from the real run, which refreshes."
            echo
            echo "The real run additionally drops \`kubernetes_*\` and \`helm_release.*\`"
            echo "from state before planning — those objects are deleted by the cluster"
            echo "teardown rather than through their own providers."
            echo
            echo "<details><summary>resources tracked in state ($(wc -l < state-list.txt))</summary>"
            echo
            echo '```'
            cat state-list.txt
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>resources a destroy would remove</summary>"
            echo
            echo '```'
            grep -E '^  # ' destroy-preview.txt || echo "(none listed)"
            echo '```'
            echo "</details>"
            echo
            echo "---"
            echo "To execute: dispatch again with **plan_only unchecked** and \`confirm = destroy\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── REAL TEARDOWN path ───────────────────────────────────────────────────

      - name: drop k8s and helm resources from state
        if: ${{ !inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          set -euo pipefail
          # The Kubernetes provider stores null identity for resources created during
          # a partial apply. Those null identities block refresh, plan, and destroy.
          # Removing them from state is safe: Kubernetes resources are deleted
          # automatically when the EKS cluster is destroyed.
          terraform state list 2>/dev/null \
            | grep -E '^(kubernetes_|helm_release\.)' \
            | xargs -r terraform state rm

      # Show what will be removed, and apply exactly that.
      #
      # Previously this went straight to `terraform destroy -auto-approve`, so a
      # 71-resource teardown ran with no preview. The saved plan makes the destroy
      # reviewable after the fact — the step summary records precisely what was
      # removed — and it means the destroy applies the plan that was computed,
      # rather than recomputing at apply time.
      - name: plan the destroy
        if: ${{ !inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          set -euo pipefail
          terraform plan -destroy -no-color -input=false -lock-timeout=30m \
            -out=tfplan-destroy | tee destroy-plan.txt
          grep -qE '^(Plan: |No changes)' destroy-plan.txt || {
            echo "no plan summary — refusing to destroy" >&2; exit 1; }

      - name: destroy summary
        if: ${{ !inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          {
            echo "# DESTROY — ${{ inputs.target }}"
            echo
            echo '```'
            grep -E '^(Plan: |No changes)' destroy-plan.txt
            echo '```'
            echo "<details><summary>resources destroyed</summary>"
            echo
            echo '```'
            grep -E '^  # ' destroy-plan.txt || echo "(none listed)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: destroy aws resources
        if: ${{ !inputs.plan_only }}
        working-directory: workloads/${{ inputs.target }}/${{ inputs.layer }}
        run: |
          set -euo pipefail
          # Applies the saved plan, not a freshly computed one.
          terraform apply -no-color -input=false -lock-timeout=30m tfplan-destroy
