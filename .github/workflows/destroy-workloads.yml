name: Destroy workloads
run-name: "Destroy ${{ inputs.target }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
      confirm:
        description: 'Type "destroy" to confirm permanent deletion'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: destroy ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: check confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "destroy" ]]; then
            echo "type 'destroy' in the confirm field to proceed" >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # eaf-baseline-dev-role explicitly, not a `||` fallback.
      #
      # The previous expression was:
      #   ${{ vars.AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN || vars.AWS_BASELINE_DEV_ROLE_ARN }}
      #
      # That is a latent trap. It worked on 29 August only because
      # AWS_WORKLOAD_DEV_DEPLOYER_ROLE_ARN did not exist yet, so it fell through to
      # the baseline role and destroyed 71 resources cleanly (run 33244371784).
      # The variable was created eight hours later, at which point the expression
      # silently began selecting the deployer role instead — and that role cannot
      # be assumed from this workflow at all, because this job declares
      # `environment: dev`, making the OIDC subject `...:environment:dev`, while
      # the deployer role's trust accepts only `...:ref:refs/heads/*`.
      #
      # So adding a repository variable broke a workflow that did not mention it.
      # A `||` between two roles with different trust conditions is not a fallback,
      # it is a hidden switch. Named explicitly now.
      #
      # eaf-baseline-dev-role is the right principal: it lives in the management
      # account so it survives destroying this layer, its trust requires
      # `environment:dev` which this job provides, it can read and write
      # workloads/dev/* state, and it holds sts:AssumeRole on
      # OrganizationAccountAccessRole — which provider.tf now assumes into.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-workload-destroy-${{ github.run_id }}

      - name: clear stuck state lock
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          # S3 native locking (use_lockfile=true) leaves a .tflock object when a
          # runner crashes. Delete it so the next init/destroy can acquire the lock.
          BUCKET=$(grep 'bucket' backend.hcl | awk -F'"' '{print $2}')
          KEY=$(grep '^key' backend.hcl | awk -F'"' '{print $2}')
          aws s3 rm "s3://${BUCKET}/${KEY}.tflock" --region eu-west-2 || true

      - name: init
        working-directory: workloads/eaf/${{ inputs.target }}
        run: terraform init -input=false -no-color -backend-config=backend.hcl

      - name: drop k8s and helm resources from state
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          set -euo pipefail
          # The Kubernetes provider stores null identity for resources created during
          # a partial apply. Those null identities block refresh, plan, and destroy.
          # Removing them from state is safe: Kubernetes resources are deleted
          # automatically when the EKS cluster is destroyed.
          terraform state list 2>/dev/null \
            | grep -E '^(kubernetes_|helm_release\.)' \
            | xargs -r terraform state rm

      # Show what will be removed, and apply exactly that.
      #
      # Previously this went straight to `terraform destroy -auto-approve`, so a
      # 71-resource teardown ran with no preview. The saved plan makes the destroy
      # reviewable after the fact — the step summary records precisely what was
      # removed — and it means the destroy applies the plan that was computed,
      # rather than recomputing at apply time.
      - name: plan the destroy
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          set -euo pipefail
          terraform plan -destroy -no-color -input=false -lock-timeout=30m \
            -out=tfplan-destroy | tee destroy-plan.txt
          grep -qE '^(Plan: |No changes)' destroy-plan.txt || {
            echo "no plan summary — refusing to destroy" >&2; exit 1; }

      - name: destroy summary
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          {
            echo "## destroy plan for ${{ inputs.target }}"
            echo '```'
            grep -E '^(Plan: |No changes)' destroy-plan.txt
            echo '```'
            echo "<details><summary>resources to be destroyed</summary>"
            echo
            echo '```'
            grep -E '^  # ' destroy-plan.txt || echo "(none listed)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: destroy aws resources
        working-directory: workloads/eaf/${{ inputs.target }}
        run: |
          set -euo pipefail
          # Applies the saved plan, not a freshly computed one.
          terraform apply -no-color -input=false -lock-timeout=30m tfplan-destroy
