name: Create accounts
run-name: "Create accounts by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm account creation'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: check confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "apply" ]]; then
            echo "type 'apply' in the confirm field to proceed" >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-accounts-plan-${{ github.run_id }}

      - name: verify management account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "wrong account: $actual" >&2
            exit 1
          fi

      - name: plan
        id: plan
        working-directory: bootstrap/org-structure
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out=tfplan -detailed-exitcode \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          grep -qE '^(Plan: |No changes)' plan.txt || { echo "no plan summary" >&2; exit 1; }
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform show -json tfplan > plan.json

      - name: validate SCP
        run: bash scripts/check-policies.sh bootstrap/org-structure/plan.json policy-out

      - name: summary
        if: always()
        working-directory: bootstrap/org-structure
        run: |
          {
            echo "## Account plan"
            echo "**Account creation is permanent. Read before approving.**"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-accounts-${{ github.run_id }}
          path: |
            bootstrap/org-structure/tfplan
            bootstrap/org-structure/plan.txt
          retention-days: 5

  create:
    name: create accounts
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: management
    concurrency:
      group: create-accounts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-accounts-${{ github.run_id }}
          path: bootstrap/org-structure
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-accounts-create-${{ github.run_id }}
      - name: verify management account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "wrong account: $actual" >&2
            exit 1
          fi
      - name: create accounts
        working-directory: bootstrap/org-structure
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform apply -no-color -input=false -lock-timeout=5m tfplan
      - name: summary
        working-directory: bootstrap/org-structure
        run: |
          {
            echo "## Accounts created"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no-changes:
    name: no changes
    needs: plan
    if: needs.plan.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
            echo "### Accounts: no changes" >> "$GITHUB_STEP_SUMMARY"
