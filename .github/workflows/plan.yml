# PLAN. Read-only, changes nothing.
#
# Runs on ANY branch that touches bootstrap/**, accounts/**, or scripts/**. The path
# filter is the control — not the branch name.
#
# Why any branch: the pipeline is a shared account vending service. Any team opens a
# feature branch, adds an entry to accounts/register.yaml, and needs to see the plan
# before their PR is reviewed. Restricting to request/** would mean only accounts
# requested via the old form-based workflow got a plan; direct YAML edits would merge
# blind.
#
# It runs on:
#
#   any branch   when bootstrap/**, accounts/**, or scripts/** changes — plan visible
#                in the PR before anyone merges it.
#   main         drift detection. Answers "does AWS still match the code".
#   dispatch     on demand, any branch.
#
# Results appear on a pull request because GitHub attaches check runs to the commit,
# so any feature branch gets its plan visible in review without needing a
# `pull_request` trigger. That matters: the pull-request token carries a DIFFERENT
# `sub` claim, which the plan role does not accept.
#
# Uses the PLAN role: ReadOnlyAccess plus permission to write `*.tflock` only. A plan has
# to take the state lock, which ReadOnlyAccess does not cover, and that failure arrives
# late and looks like a state problem rather than a permissions one.

name: plan

on:
  push:
    branches: ["**"]
    paths:
      - "bootstrap/**"
      - "accounts/**"
      - "scripts/**"
      - ".github/workflows/plan.yml"
  workflow_dispatch:

permissions:
  # Required to get an OIDC token at all. Without it the credentials step fails with a
  # message that does not mention permissions.
  id-token: write
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.13.3
  TF_IN_AUTOMATION: "true"

jobs:
  seed:
    name: plan seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # No wrapper. It rewrites stdout, which breaks anything that greps the output.
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-plan-seed-${{ github.run_id }}

      - name: verify the account
        run: |
          set -euo pipefail
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual" != "${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" ]]; then
            echo "refusing: credentials resolve to $actual" >&2
            exit 1
          fi
          echo "account $actual"

      - name: plan
        working-directory: bootstrap/seed
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt

          # Fail if the summary line is absent rather than assume no changes. Terraform
          # colorizes even into a pipe, so -no-color above is what makes this grep able to
          # match at all. A check that silently matches nothing is worse than no check.
          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found - do not trust this run" >&2
            exit 1
          fi

      - name: summary
        if: always()
        working-directory: bootstrap/seed
        run: |
          {
            echo "### seed"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  organization:
    name: plan organization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-plan-org-${{ github.run_id }}

      # No email plumbing here any more. The account set comes from
      # accounts/register.yaml and the addresses come from SSM, both read by Terraform.
      - name: plan
        working-directory: bootstrap/org-structure
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out=tfplan \
            -var="management_account_id=${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}" \
            | tee plan.txt

          if ! grep -qE '^(Plan: |No changes)' plan.txt; then
            echo "no plan summary found - do not trust this run" >&2
            exit 1
          fi

          terraform show -json tfplan > plan.json

      # Runs here rather than in the credential-free `checks` workflow because it needs
      # both real AWS (Access Analyzer) and a resolved plan. Static checks cannot catch a
      # nonexistent IAM action, and an unknown action inside a Deny denies nothing while
      # reading as a guardrail.
      - name: validate the SCP
        run: bash scripts/check-policies.sh bootstrap/org-structure/plan.json policy-out

      - name: summary
        if: always()
        working-directory: bootstrap/org-structure
        run: |
          {
            echo "### organization"
            echo '```'
            grep -E '^(Plan: |No changes)' plan.txt || echo "plan did not complete"
            echo '```'
            echo "Account creation is effectively permanent: closure takes 90 days and a"
            echo "closed account still counts against the org quota. Read the full plan in"
            echo "the job log before approving an apply."
          } >> "$GITHUB_STEP_SUMMARY"
