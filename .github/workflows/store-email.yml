# STORE EMAIL. One job, one purpose: write an account email to SSM.
#
# This is the ONLY step that requires a workflow form. Everything else in the
# account vending flow happens through git:
#
#   1. Run this workflow once — provide the account name and its email.
#      The email is stored at /eaf/accounts/<NAME>/email in SSM Parameter Store.
#      It NEVER enters git history.
#
#   2. Create a feature branch and add an entry to accounts/register.yaml.
#      The entry contains everything except the email (which is now in SSM).
#
#   3. Open a pull request to main.
#      checks validates the YAML schema.
#      plan shows exactly what will be created.
#
#   4. Reviewer reads the one-line diff + plan, merges.
#      apply runs (manual dispatch for now), creates the account.
#
# WHY THE EMAIL GOES TO SSM AND NOT INTO THE PULL REQUEST:
#
# An account's email becomes its root user and its only account-recovery address.
# It is personal data and it is permanent — AWS has no API to change it. So it
# never enters git history, and never appears in a plan artifact.
#
# WHY THIS WORKFLOW EXISTS SEPARATELY:
#
# The previous request-account workflow automated the YAML edit and PR creation.
# That removed the developer from the audit trail. Now the developer owns the
# YAML change and the PR — their git author line IS the request record.
# This workflow handles only the one thing git cannot: storing a secret safely.

name: store-email

on:
  workflow_dispatch:
    inputs:
      account_name:
        description: "Account name (must match the name you will use in accounts/register.yaml)"
        required: true
        type: string
      account_email:
        description: "Root email. Globally unique across all of AWS. CANNOT be changed after creation."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest

    env:
      NAME: ${{ inputs.account_name }}
      EMAIL: ${{ inputs.account_email }}
      PREFIX: ${{ vars.AWS_EMAIL_PARAMETER_PREFIX }}

    steps:
      - name: validate inputs
        run: |
          set -euo pipefail

          if ! printf '%s' "$EMAIL" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "ERROR: not a valid email address" >&2
            exit 1
          fi

          if ! printf '%s' "$NAME" | grep -qE '^[A-Za-z0-9][A-Za-z0-9-]{0,49}$'; then
            echo "ERROR: account name must be letters, digits and hyphens, max 50 chars" >&2
            exit 1
          fi

          if [[ -z "$PREFIX" ]]; then
            echo "ERROR: AWS_EMAIL_PARAMETER_PREFIX repository variable is not set" >&2
            exit 1
          fi

          echo "inputs ok — name=$NAME prefix=$PREFIX"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ACCOUNT_REQUEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: eaf-store-email-${{ github.run_id }}

      - name: store email in SSM
        run: |
          set -euo pipefail
          param="${PREFIX}/${NAME}/email"

          # Refuse to overwrite. An existing parameter means the account either exists
          # or was already requested. AWS cannot change an account's email afterwards,
          # so overwriting would leave the parameter and the real account disagreeing.
          if aws ssm get-parameter --name "$param" >/dev/null 2>&1; then
            echo "ERROR: $param already exists. Refusing to overwrite." >&2
            echo "An account email cannot be changed after creation." >&2
            exit 1
          fi

          aws ssm put-parameter \
            --name  "$param" \
            --type  String \
            --value "$EMAIL" \
            --description "Root email for AWS account ${NAME}. Stored by ${{ github.actor }}, run ${{ github.run_id }}." \
            --tags "Key=ManagedBy,Value=github-actions" "Key=Account,Value=${NAME}" \
            > /dev/null

          # Print the parameter NAME, never the value.
          echo "stored $param"
          echo ""
          echo "Next: add an entry for ${NAME} to accounts/register.yaml on a feature branch,"
          echo "then open a pull request to main."

      - name: summary
        if: always()
        run: |
          {
            echo "### Email stored for \`${NAME}\`"
            echo ""
            echo "Parameter: \`${PREFIX}/${NAME}/email\`"
            echo ""
            echo "**Next steps:**"
            echo "1. Create a feature branch"
            echo "2. Add an entry for \`${NAME}\` to \`accounts/register.yaml\`"
            echo "3. Open a pull request to \`main\`"
            echo "4. The plan will show \`1 to add\` — review and merge"
          } >> "$GITHUB_STEP_SUMMARY"
