# THE ACCOUNT REGISTER — the input layer.
#
# One entry per AWS account this repository manages. This file decides WHICH accounts
# exist and WHICH OU each one lives in. Its git history is the audit trail: who asked for
# each account, when, and who approved the pull request.
#
# DO NOT EDIT BY HAND — use the register-account workflow:
#   Actions > register-account > Run workflow
#
# THERE IS NO EMAIL IN THIS FILE, DELIBERATELY.
# Emails are stored in SSM at /eaf/accounts/<NAME>/email.
#
EAF-DEV:
  cost_centre: CC-1001
  description: Development account for the Enterprise Agent Framework platform
  environment: dev
  ou: Workloads
  owner: platform-team
  project: enterprise-agent-framework
  requested: "2026-08-19"
  ticket: EAF-1

EAF-PROD:
  cost_centre: CC-1002
  description: Production account for the Enterprise Agent Framework platform
  environment: prod
  ou: Workloads
  owner: platform-team
